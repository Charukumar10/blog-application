
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to My Blog</h2>
            <p>Share your thoughts, stories and ideas with the world.</p>
            <button onclick="showMessage()">Explore Blogs</button>
        </section>

        <section class="blogs">
            <h2>Latest Blogs</h2>

            <div class="blog-card">
                <h3>Introduction to Technology</h3>
                <p>Technology makes our daily lives easier and better.</p>
                <button>Read More</button>
            </div>

            <div class="blog-card">
                <h3>Importance of Learning</h3>
                <p>Learning new skills helps us grow every day.</p>
                <button>Read More</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
