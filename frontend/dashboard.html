
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="#" onclick="logoutUser(); return false;">Logout</a>
        </nav>
    </header>

    <main class="dashboard">

        <h2>Welcome to Your Dashboard!</h2>

        <p>Manage your blogs in one place.</p>

        <div class="dashboard-cards">

            <div class="blog-card">
                <h3>Total Blogs</h3>
                <p id="totalBlogs">0</p>
            </div>

            <div class="blog-card">
                <h3>Published Blogs</h3>
                <p id="publishedBlogs">0</p>
            </div>

        </div>

        <a href="create-blog.html">
            <button type="button">Create New Blog</button>
        </a>

        <h2>My Blog Posts</h2>

        <div id="blogList"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
